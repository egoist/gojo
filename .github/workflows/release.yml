# Push a tag `vX.Y.Z` (matching Cargo.toml) to build the archives and publish
# a release with them. install.sh then installs from this repository's
# releases with KITE_RELEASES=https://github.com/OWNER/kite/releases.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: cargo install cargo-zigbuild --locked
      - name: check the tag matches the version
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$GITHUB_REF_NAME"
      - run: JOBS=4 scripts/release.sh
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --title "Kite $GITHUB_REF_NAME" --generate-notes dist/*.tar.gz dist/SHA256SUMS dist/VERSION dist/install.sh
