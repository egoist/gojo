name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    # a hung program fails the job instead of holding a runner for six hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: cargo build --locked
      - run: cargo test --locked
      # One sanitizer per step, not the ignored tests side by side: each needs
      # much memory, and a step shows its report even if a later one hangs.
      - name: AddressSanitizer and UBSan
        if: runner.os == 'Linux'
        run: cargo test --locked --test suite -- --ignored --exact address_sanitizer
      - name: ThreadSanitizer
        if: runner.os == 'Linux'
        run: cargo test --locked --test suite -- --ignored --exact thread_sanitizer
      - name: TypeSanitizer (where clang has it)
        if: runner.os == 'Linux'
        run: cargo test --locked --test suite -- --ignored --exact type_sanitizer
      - run: ./target/debug/gojo fmt --check std examples
